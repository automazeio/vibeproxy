name: CI

on:
  push:
    branches: [main, master, develop, feature/*, bugfix/*, docs/*]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'  # Weekly Sunday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Setup environment
        uses: ./.github/actions/setup
        
      - name: Check formatting
        run: task check
        
      - name: Run linter
        run: task lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Setup environment
        uses: ./.github/actions/setup
        
      - name: Run tests
        run: task test
        
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Setup environment
        uses: ./.github/actions/setup
        
      - name: Build release
        run: task build

  phenotype-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: KooshaPari/phenotypeActions/.github/workflows/validate-governance.yml@main
